name: Semantic Release Dry Run

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  semantic-release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - run: git switch -c main
      - name: Semantic Release Dry Run
        id: semantic
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          RELEASE_NOTES=$(npx semantic-release --branches $BRANCH_NAME --dry-run | grep "release notes:" -A3 || echo "(nothing)")
          echo "::set-output name=notes::$RELEASE_NOTES"

      - name: Comment PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: "## RELEASE NOTE\n${{ steps.semantic.outputs.notes }}"
